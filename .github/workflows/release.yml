name: Build release downloads

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+([.][0-9]+){1,3}$ ]]; then
            echo "Use a numeric release tag such as v0.1 or v0.1.0." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ "$version" =~ ^[0-9]+[.][0-9]+$ ]]; then
            version="${version}.0"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install test and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi python3-cairo python3-gi-cairo python3-qrcode python3-pil gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 librsvg2-common libzbar0 xvfb xauth desktop-file-utils
      - name: Run isolated tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate helper script
        run: bash -n create_ap
      - name: Set reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build Debian package
        run: /usr/bin/python3 scripts/build_deb.py --version "$RELEASE_VERSION" --debian-version "1:$RELEASE_VERSION"
      - name: Archive the released source
        run: git archive --format=zip --prefix=Z-Hotspot/ --output="dist/Z-Hotspot-${RELEASE_TAG}.zip" HEAD
      - name: Checksum release downloads
        working-directory: dist
        run: sha256sum -- "z-hotspot_${RELEASE_VERSION}_all.deb" "Z-Hotspot-${RELEASE_TAG}.zip" > SHA256SUMS
      - name: Attach downloads to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/z-hotspot_${RELEASE_VERSION}_all.deb" \
            "dist/Z-Hotspot-${RELEASE_TAG}.zip" \
            dist/SHA256SUMS
